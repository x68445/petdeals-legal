<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 알리특가</title>
    <style>
        
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
           background:#f5f5f5; color:#333; }
    .header { background:linear-gradient(135deg,#ff6b00,#e53935); color:white;
              padding:20px 16px; text-align:center; }
    .header h1 { font-size:22px; margin-bottom:4px; }
    .header p  { font-size:13px; opacity:0.9; margin-top:2px; }
    .footer { text-align:center; padding:20px 16px; font-size:11px; color:#999;
              line-height:1.6; }
    .footer a { color:#999; text-decoration:underline; }

        .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px;
                 padding:16px; max-width:600px; margin:0 auto; }
        @media(min-width:480px) { .grid { grid-template-columns:repeat(3,1fr); } }
        @media(min-width:700px) { .grid { grid-template-columns:repeat(4,1fr); } }
        .cat-card { background:white; border-radius:14px; padding:18px 8px;
                    text-decoration:none; color:#333; text-align:center;
                    box-shadow:0 1px 4px rgba(0,0,0,0.1);
                    transition:transform 0.1s,box-shadow 0.1s;
                    display:flex; flex-direction:column; align-items:center; gap:6px; }
        .cat-card:active { transform:scale(0.96); }
        .cat-emoji { font-size:32px; }
        .cat-label { font-size:14px; font-weight:700; }
        .cat-count { font-size:12px; color:#e53935; font-weight:600; }
    </style>
</head>

        <a href="category_camping.html" class="cat-card">
