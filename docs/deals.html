<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 알리특가</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#f5f5f5; color:#333; }
        .header { background:linear-gradient(135deg,#ff6b00,#e53935); color:white; padding:24px 16px; text-align:center; }
        .header h1 { font-size:22px; margin-bottom:4px; }
        .header p { font-size:13px; opacity:0.9; }
        .deals { padding:12px; max-width:500px; margin:0 auto; }
        .deal { display:flex; align-items:center; justify-content:space-between;
                 background:white; border-radius:12px; padding:16px; margin-bottom:10px;
                 text-decoration:none; color:#333; box-shadow:0 1px 4px rgba(0,0,0,0.1);
                 transition:transform 0.1s,box-shadow 0.1s; }
        .deal:active { transform:scale(0.98); box-shadow:0 0 0 rgba(0,0,0,0.05); }
        .deal-info { flex:1; min-width:0; }
        .deal-name { font-size:15px; font-weight:600; margin-bottom:4px;
                      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .deal-price { font-size:14px; color:#e53935; font-weight:700; }
        .badge { background:#ff6b00; color:white; padding:2px 7px;
                  border-radius:10px; font-size:11px; margin-left:6px;
                  white-space:nowrap; }
        .deal-arrow { font-size:20px; color:#ccc; margin-left:12px; flex-shrink:0; }
        .footer { text-align:center; padding:20px; font-size:12px; color:#999; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔥 오늘의 알리특가</h1>
        <p>2026년 04월 14일 업데이트</p>
    </div>
    <div class="deals">
        
        <a href="https://ko.aliexpress.com/item/test1.html" class="deal" target="_blank" rel="noopener noreferrer">
            <div class="deal-info">
                <div class="deal-name">고양이 자동 급수기</div>
                <div class="deal-price">₩16,875 <span class="badge">65% 할인</span></div>
            </div>
            <div class="deal-arrow">→</div>
        </a>
        <a href="https://ko.aliexpress.com/item/test2.html" class="deal" target="_blank" rel="noopener noreferrer">
            <div class="deal-info">
                <div class="deal-name">LED 캠핑 랜턴</div>
                <div class="deal-price">₩10,800 <span class="badge">40% 할인</span></div>
            </div>
            <div class="deal-arrow">→</div>
        </a>
        <a href="https://ko.aliexpress.com/item/test3.html" class="deal" target="_blank" rel="noopener noreferrer">
            <div class="deal-info">
                <div class="deal-name">무선 충전 패드</div>
                <div class="deal-price">₩7,425 <span class="badge">55% 할인</span></div>
            </div>
            <div class="deal-arrow">→</div>
        </a>
    </div>
    <div class="footer">
        매일 새로운 특가가 업데이트됩니다!<br>
        YouTube: 알리특가 쇼츠
    </div>
</body>
</html>
