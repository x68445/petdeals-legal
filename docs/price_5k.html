        .prod-count {

            color:var(--accent); background:rgba(var(--accent-rgb),.10);
            padding:4px 14px; border-radius:999px; }
        .section { margin-bottom:28px; }
        .section-header {

            margin-bottom:10px; }
        .sec-emoji { font-size:22px; } .sec-label { font-size:16px; font-weight:700; flex:1; }
        .sec-badge { font-size:12px; font-weight:600; padding:3px 10px; border-radius:999px; }

            text-decoration:none; color:#1a1a1a;

            transition:transform .2s ease, box-shadow .2s ease; }
        .deal:hover  { transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,0,0,.08); }
        .deal:active { transform:scale(.98); }
        .thumb { width:72px; height:72px; border-radius:12px; flex-shrink:0; overflow:hidden;
            display:flex; align-items:center; justify-content:center; font-size:28px; }
        .thumb img { width:72px; height:72px; object-fit:cover; display:block; flex-shrink:0; }
        .deal-info { flex:1; min-width:0; }
        .deal-name { font-size:15px; font-weight:600; line-height:1.4;
            display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        .price-row { display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap; }
        .deal-price { font-size:18px; font-weight:800; color:#1a1a1a; }
        .badge { background:linear-gradient(135deg,#ff4757,#ff6b6b); color:white;
            padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; }
        .deal-arrow { font-size:20px; opacity:.4; flex-shrink:0; }
